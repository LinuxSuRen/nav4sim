# Docker image publishing — builds on every PR (no push), and pushes to GHCR on:
#   - merges to master:  :latest  and  :master-<shortsha>
#   - version tags (v*): :<version> (e.g. v0.1.0)  and  :master-<shortsha>
#
# Uses the built-in GITHUB_TOKEN (no extra secrets); GHCR image name is the
# repo name lowercased (GHCR requirement). The first push creates the package
# — make it public in Package settings if anonymous pulls should work.

name: docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=master-

      # Nothing is pushed before the image is proven to actually run:
      # a truncated/corrupt image (see issue #9) must fail here, not at users.
      - name: Build image locally (smoke candidate)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nav4sim:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime smoke test (default world loads, LiDAR publishes, no SDF errors)
        run: |
          docker run -d --name gz-smoke -e ROS_DOMAIN_ID=99 nav4sim:smoke bash -c \
            "source /opt/ros/humble/setup.bash && ros2 launch /opt/gz/launch/gz.launch.py gui:=false"
          trap 'docker rm -f gz-smoke' EXIT
          sleep 25
          docker exec -e ROS_DOMAIN_ID=99 gz-smoke bash -c \
            "source /opt/ros/humble/setup.bash && timeout 8 ros2 topic hz /points_raw --window 10 2>/dev/null" \
            | tee hz.txt
          grep -q 'average rate' hz.txt
          if docker logs gz-smoke 2>&1 | grep -E 'Unable to parse|failed to load|\[Err\]|file too short'; then
            echo "gzserver reported errors"; exit 1
          fi

      - name: Build (and push off PRs; layers come from the smoke-tested cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image exists in the registry
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:master-${GITHUB_SHA::7}"
