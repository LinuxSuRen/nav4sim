# Docker image publishing — builds on every PR (no push), and pushes to GHCR on:
#   - merges to master:  :latest  and  :master-<shortsha>
#   - version tags (v*): :<version> (e.g. v0.1.0)  and  :master-<shortsha>
#
# Uses the built-in GITHUB_TOKEN (no extra secrets); GHCR image name is the
# repo name lowercased (GHCR requirement). The first push creates the package
# — make it public in Package settings if anonymous pulls should work.

name: docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=master-

      - name: Build (and push off PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed image exists in the registry
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:master-${GITHUB_SHA::7}"
